name: Build and Deploy
on:
  push:
    branches:
      - master
      - lxy

# 同一分支连续 push 时，自动取消还在跑的旧构建，避免资源浪费和状态混乱
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/hydrogen
          cache: pnpm

      - name: Install Dependencies
        run: pnpm i

      # - name: Run Tests
      #   run: yarn test

      - name: Run Build
        run: pnpm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4.2.5
        with:
          branch: gh-pages
          folder: dist
